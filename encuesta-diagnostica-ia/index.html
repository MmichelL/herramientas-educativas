<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1F1A14" />
  <title>Encuesta diagnóstica IA — UNAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════════
       Encuesta diagnóstica IA — UNAD
       Aesthetic: editorial académico cálido. Paleta papel/tinta/oxblood.
       ══════════════════════════════════════════════════════════════════ */
    :root {
      --cream:   #FAF6EE;   /* fondo página */
      --paper:   #FFFCF6;   /* fondo card */
      --bone:    #EFE7D5;   /* fondo opción */
      --blush:   #E6D9BD;   /* hover opción */
      --rule:    #D9CDB4;   /* hairline */
      --rule-soft:#E8DDC5;  /* subdivisión */
      --ink:     #1F1A14;   /* texto cuerpo */
      --ink-soft:#564B3D;   /* texto secundario */
      --ink-mute:#867968;   /* hint */
      --oxblood: #7A2424;   /* primario / acento */
      --oxblood-deep:#5A1717;
      --gold:    #B6863E;   /* highlights */
      --sage:    #5F6F4F;   /* éxito / secundario */
      --sage-deep:#43523A;
      --crimson: #9B3B3B;   /* peligro */
      --crimson-deep:#732424;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }

    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.55;
      font-size: 16px;
      font-feature-settings: "ss01", "cv11";
      /* sutil grano de papel */
      background-image:
        radial-gradient(rgba(122,36,36,0.012) 1px, transparent 1px),
        radial-gradient(rgba(31,26,20,0.010) 1px, transparent 1px);
      background-size: 23px 23px, 41px 41px;
      background-position: 0 0, 12px 19px;
    }

    /* Layout */
    .container       { max-width: 680px;  margin: 0 auto; padding: 32px 20px 60px; }
    .container-wide  { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }

    /* Tipografía editorial */
    h1, h2, h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.15;
    }
    h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 600; font-variation-settings: "opsz" 96, "SOFT" 50; }
    h2 { font-size: 1.35rem; font-weight: 600; margin: 0.2em 0 0.6em; font-variation-settings: "opsz" 36; }
    h3 { font-size: 1.02rem; font-weight: 600; color: var(--ink); margin: 0.4em 0 0.5em; font-variation-settings: "opsz" 24; }
    p  { margin-bottom: 0.75em; color: var(--ink-soft); }
    a  { color: var(--oxblood); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { color: var(--oxblood-deep); }

    .eyebrow {
      display: inline-block;
      font-family: 'Manrope', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--oxblood);
    }
    .eyebrow.muted { color: var(--ink-mute); }

    .rule { height: 1px; background: var(--rule); margin: 18px 0; border: 0; }
    .rule-double {
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      height: 4px;
      margin: 14px 0;
    }
    .ornament {
      text-align: center;
      color: var(--gold);
      font-family: 'Fraunces', serif;
      font-size: 0.95rem;
      letter-spacing: 0.6em;
      margin: 8px 0 18px;
      user-select: none;
    }
    .ornament::before { content: "✦   ✦   ✦"; }

    /* Header editorial */
    .masthead {
      text-align: center;
      padding: 36px 20px 12px;
      border-bottom: 1px solid var(--rule);
      background: transparent;
    }
    .masthead .eyebrow { display: block; margin-bottom: 16px; }
    .masthead h1       { margin: 0 auto 6px; max-width: 720px; }
    .masthead .meta {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--ink-soft);
      margin-top: 8px;
    }
    .masthead-narrow .eyebrow { font-size: 0.65rem; }
    .masthead-narrow h1 { font-size: clamp(1.5rem, 3.2vw, 2rem); }

    /* Cards — papel */
    .card {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 28px 26px;
      margin-bottom: 18px;
      box-shadow:
        0 1px 0 0 rgba(31,26,20,0.04),
        0 14px 30px -22px rgba(31,26,20,0.18);
      position: relative;
    }
    .card > h2 + .rule,
    .card .section-head + .rule { margin: 12px 0 22px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 4px;
    }
    .section-head .eyebrow { color: var(--oxblood); }

    /* Botones — diseño editorial */
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid var(--oxblood);
      border-radius: 1px;
      cursor: pointer;
      min-height: 46px;
      background: var(--oxblood);
      color: var(--paper);
      text-decoration: none;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.12s;
      box-shadow: inset 0 0 0 1px rgba(255,252,246,0.06);
    }
    button:hover, .btn:hover {
      background: var(--oxblood-deep);
      border-color: var(--oxblood-deep);
      color: var(--paper);
    }
    button:active, .btn:active { transform: translateY(1px); }
    button:disabled, .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .btn-danger {
      background: var(--crimson);
      border-color: var(--crimson);
    }
    .btn-danger:hover { background: var(--crimson-deep); border-color: var(--crimson-deep); }
    .btn-success {
      background: var(--sage);
      border-color: var(--sage);
      color: var(--paper);
    }
    .btn-success:hover { background: var(--sage-deep); border-color: var(--sage-deep); }
    .btn-ghost {
      background: transparent;
      color: var(--oxblood);
      border: 1px solid var(--rule);
    }
    .btn-ghost:hover { background: var(--bone); color: var(--oxblood-deep); border-color: var(--oxblood); }

    /* Form */
    .field { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px dashed var(--rule-soft); }
    .field:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .field > label {
      display: block;
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.04rem;
      margin-bottom: 12px;
      color: var(--ink);
      line-height: 1.35;
      font-variation-settings: "opsz" 24;
    }
    .field .hint {
      font-family: 'Manrope', sans-serif;
      font-size: 0.78rem;
      color: var(--ink-mute);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    /* Opciones */
    .options { display: flex; flex-direction: column; gap: 6px; }
    .option {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 1px;
      cursor: pointer;
      min-height: 46px;
      user-select: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      font-size: 0.95rem;
      color: var(--ink);
      gap: 10px;
    }
    .option:hover { background: var(--bone); border-color: var(--ink-soft); }
    .option input {
      appearance: none;
      width: 16px; height: 16px;
      border: 1px solid var(--ink-soft);
      background: var(--paper);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .option input[type="radio"] { border-radius: 50%; }
    .option input[type="checkbox"] { border-radius: 1px; }
    .option input:checked {
      background: var(--oxblood);
      border-color: var(--oxblood);
    }
    .option input[type="radio"]:checked::after {
      content: "";
      position: absolute;
      inset: 3px;
      background: var(--paper);
      border-radius: 50%;
    }
    .option input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px; top: 1px;
      width: 5px; height: 9px;
      border: solid var(--paper);
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }
    .option.selected {
      background: var(--bone);
      border-color: var(--oxblood);
      color: var(--ink);
    }

    /* Likert — fila editorial */
    .likert-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 4px;
    }
    .likert-row .option {
      flex-direction: column;
      justify-content: center;
      padding: 14px 4px 12px;
      text-align: center;
      gap: 2px;
      position: relative;
    }
    .likert-row .option input { display: none; }
    .likert-row .option .num {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--ink);
      font-variation-settings: "opsz" 36;
      line-height: 1;
    }
    .likert-row .option .label {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-top: 4px;
    }
    .likert-row .option.selected {
      background: var(--ink);
      border-color: var(--ink);
    }
    .likert-row .option.selected .num,
    .likert-row .option.selected .label {
      color: var(--paper);
    }

    /* Inputs */
    input[type="password"],
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      font-family: 'Manrope', sans-serif;
      font-size: 0.95rem;
      border: 1px solid var(--rule);
      border-radius: 1px;
      background: var(--paper);
      min-height: 44px;
      color: var(--ink);
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--oxblood);
    }
    .filter-dd {
      min-height: 38px;
      padding: 6px 10px;
      font-size: 0.86rem;
      font-weight: 500;
      background: var(--paper);
      width: auto;
      min-width: 180px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 1px;
      box-shadow: 0 14px 40px -10px rgba(31,26,20,0.4);
      z-index: 1000;
      max-width: 92vw;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      animation: toast-in 0.25s ease-out;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 12px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast.success { background: var(--sage); }
    .toast.error   { background: var(--crimson); }

    .hidden { display: none !important; }

    /* Landing */
    .landing-lead {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--ink-soft);
      margin: 28px 0 36px;
      text-align: center;
      max-width: 540px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
    .landing-cta {
      display: grid;
      gap: 10px;
      margin-top: 22px;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
    .landing-cta .btn {
      padding: 22px 24px;
      font-size: 1rem;
      letter-spacing: 0.06em;
      justify-content: space-between;
    }
    .landing-cta .btn::after {
      content: "→";
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
    }
    .landing-foot {
      margin-top: 48px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--ink-mute);
      letter-spacing: 0.05em;
    }
    .landing-foot a { color: var(--ink-mute); text-decoration: none; border-bottom: 1px solid var(--rule); }
    .landing-foot a:hover { color: var(--oxblood); border-color: var(--oxblood); }

    /* Dashboard chrome */
    .dash-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 16px 20px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .dash-toolbar > .eyebrow { color: var(--ink-mute); margin-right: 4px; }
    .dash-toolbar .spacer { flex: 1; }
    .dash-toolbar .btn { min-height: 38px; padding: 8px 16px; font-size: 0.82rem; }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px 32px;
      margin-top: 8px;
    }
    @media (max-width: 720px) {
      .dash-grid { grid-template-columns: 1fr; gap: 22px; }
    }
    .dash-chart-wrap { margin: 0; min-width: 0; }
    .dash-chart-wrap.full { grid-column: 1 / -1; }
    .dash-chart-wrap > h3 {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      margin-bottom: 10px;
      color: var(--ink);
    }
    .benchmark {
      margin-top: 8px;
      padding: 10px 14px;
      background: rgba(122,36,36,0.04);
      border-left: 2px solid var(--oxblood);
      font-size: 0.85rem;
      color: var(--ink-soft);
      font-style: italic;
      line-height: 1.5;
    }
    .benchmark strong {
      font-style: normal;
      font-family: 'Manrope', sans-serif;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--oxblood);
      margin-right: 6px;
    }

    /* Stagger reveal */
    .stagger > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise 0.45s ease-out forwards;
    }
    .stagger > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger > *:nth-child(2) { animation-delay: 0.12s; }
    .stagger > *:nth-child(3) { animation-delay: 0.19s; }
    .stagger > *:nth-child(4) { animation-delay: 0.26s; }
    .stagger > *:nth-child(5) { animation-delay: 0.33s; }
    .stagger > *:nth-child(6) { animation-delay: 0.40s; }
    .stagger > *:nth-child(7) { animation-delay: 0.47s; }
    .stagger > *:nth-child(8) { animation-delay: 0.54s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 540px) {
      .container, .container-wide { padding: 22px 16px 48px; }
      .masthead { padding: 24px 16px 10px; }
      .card { padding: 22px 18px; }
      .likert-row { gap: 5px; }
      .likert-row .option { padding: 12px 2px 10px; }
      .likert-row .option .num { font-size: 1.15rem; }
      .likert-row .option .label { font-size: 0.55rem; }
      .dash-toolbar { padding: 14px 14px; }
      .dash-toolbar .btn { width: 100%; }
      .dash-toolbar .spacer { display: none; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .stagger > * { animation: none; opacity: 1; transform: none; }
      .toast { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    // ══════════════════════════════════════════════════════════════════
    // Constants
    // ══════════════════════════════════════════════════════════════════
    const PROFESOR_MATRICULA = "2008464";
    const POLL_INTERVAL_MS = 3000;
    const FACULTADES = [
      { id: "ciencias-salud", label: "Ciencias de la Salud" },
      { id: "humanidades", label: "Humanidades" },
      { id: "ciencias-administrativas", label: "Ciencias Administrativas" },
      { id: "ingenieria-tecnologia", label: "Ingeniería y Tecnología" },

      { id: "posgrado", label: "Posgrado" },

    // ══════════════════════════════════════════════════════════════════

      { section: "Capacidad de la IA actual", code: "d1_ensayo", scope: "respuestas", type: "likert5",

      { section: "Tu uso de la IA", code: "d2_frecuencia", scope: "respuestas", type: "single",

      { section: "Tu uso de la IA", code: "d2_usos", scope: "respuestas", type: "multi",

        options: [
          { id: "buscar-info", label: "Buscar información" },
          { id: "generar-ideas", label: "Generar ideas para clase" },

      { section: "Tu uso de la IA", code: "d2_herramienta", scope: "respuestas", type: "single",

        options: [

    // Utilities
    // ══════════════════════════════════════════════════════════════════
    const $ = (sel) => document.querySelector(sel);
    const app = () => document.getElementById("app");

    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      // Fallback (modern browsers all support randomUUID, this is just defensive)
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function toast(msg, type = "info", ms = 3500) {
      const el = document.createElement("div");
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), ms);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const adminToken = sessionStorage.getItem("encuesta_ia_admin_token");
      if (adminToken && options.requireAdmin) headers["X-Admin-Token"] = adminToken;

      const maxAttempts = options.retryOnNetwork ? 2 : 1;
      let lastErr;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          const res = await fetch(path, { ...options, headers });
          const text = await res.text();
          let data;
          try { data = JSON.parse(text); } catch { data = { _raw: text }; }
          return { status: res.status, data };
        } catch (e) {
          lastErr = e;
          if (attempt < maxAttempts) {
            await new Promise((r) => setTimeout(r, 800));
            continue;
          }
        }
      }
      return { status: 0, data: { error: `Network error: ${lastErr?.message || "unknown"}` } };
    }

    // ══════════════════════════════════════════════════════════════════
    // Router
    // ══════════════════════════════════════════════════════════════════
    function getRoute() {
      const hash = window.location.hash.replace(/^#/, "");
      const [name, query = ""] = hash.split("?");
      const params = {};
      for (const pair of query.split("&")) {
        if (!pair) continue;
        const [k, v] = pair.split("=");
        params[decodeURIComponent(k)] = decodeURIComponent(v || "");
      }
      return { name: name || "landing", params };
    }

    function navigate(name, params = {}) {
      const qs = Object.entries(params).map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&");
      window.location.hash = qs ? `${name}?${qs}` : name;
    }

    function render() {
      const { name, params } = getRoute();
      const handler = ROUTES[name] || ROUTES.landing;
      app().innerHTML = "";
      handler(params);
    }

    window.addEventListener("hashchange", render);
    window.addEventListener("DOMContentLoaded", render);

    // ══════════════════════════════════════════════════════════════════
    // Form rendering
    // ══════════════════════════════════════════════════════════════════
    function renderField(q, value) {
      const id = `f_${q.code}`;
      const hint = q.hint ? `<div class="hint">${escapeHtml(q.hint)}</div>` : "";

      if (q.type === "likert5") {
        const labels = ["Muy mal", "Mal", "Regular", "Bien", "Excelente"];
        return `
          <div class="field" data-code="${q.code}" data-scope="${q.scope}" data-type="likert5">
            <label>${escapeHtml(q.label)}</label>
            ${hint}
            <div class="likert-row">
              ${[1,2,3,4,5].map(n => `
                <label class="option ${value === n ? "selected" : ""}">
                  <input type="radio" name="${id}" value="${n}" ${value === n ? "checked" : ""} hidden>
                  <div>
                    <div class="num">${n}</div>
                    <div class="label">${labels[n-1]}</div>
                  </div>
                </label>`).join("")}
            </div>
          </div>`;
      }

      if (q.type === "single") {
        return `
          <div class="field" data-code="${q.code}" data-scope="${q.scope}" data-type="single">
            <label>${escapeHtml(q.label)}</label>
            ${hint}
            <div class="options">
              ${q.options.map(o => `
                <label class="option ${value === o.id ? "selected" : ""}">
                  <input type="radio" name="${id}" value="${o.id}" ${value === o.id ? "checked" : ""}>
                  <span>${escapeHtml(o.label)}</span>
                </label>`).join("")}
            </div>
          </div>`;
      }

      if (q.type === "multi") {
        const set = new Set(value || []);
        return `
          <div class="field" data-code="${q.code}" data-scope="${q.scope}" data-type="multi">
            <label>${escapeHtml(q.label)}</label>
            ${hint}
            <div class="options">
              ${q.options.map(o => `
                <label class="option ${set.has(o.id) ? "selected" : ""}">
                  <input type="checkbox" name="${id}" value="${o.id}" ${set.has(o.id) ? "checked" : ""}>
                  <span>${escapeHtml(o.label)}</span>
                </label>`).join("")}
            </div>
          </div>`;
      }

      return "";
    }

    function bindFieldInteractions(root) {
      // Visual selected state on radios/checkboxes
      root.querySelectorAll(".option input").forEach((input) => {
        input.addEventListener("change", () => {
          const field = input.closest(".field");
          if (input.type === "radio") {
            field.querySelectorAll(".option").forEach((o) => o.classList.remove("selected"));
            input.closest(".option").classList.add("selected");
          } else {
            input.closest(".option").classList.toggle("selected", input.checked);
          }
        });
      });
    }

    function readForm(preguntas, root) {
      const data = { demograficas: {}, respuestas: {} };
      const errors = [];

      for (const q of preguntas) {
        const field = root.querySelector(`.field[data-code="${q.code}"]`);
        if (!field) continue;
        let val;

        if (q.type === "likert5" || q.type === "single") {
          const checked = field.querySelector(`input:checked`);
          val = checked ? checked.value : null;
          if (q.type === "likert5" && val !== null) val = Number(val);
        } else if (q.type === "multi") {
          val = Array.from(field.querySelectorAll(`input:checked`)).map((i) => i.value);
        }

        if (val === null || (Array.isArray(val) && val.length === 0)) {
          errors.push(q.label);
          continue;
        }

        data[q.scope][q.code] = val;
      }

      return { data, errors };
    }

    function renderFormPage(opts) {
      const { title, subtitle, preguntas, fase } = opts;
      const sections = {};
      for (const q of preguntas) {
        sections[q.section] = sections[q.section] || [];
        sections[q.section].push(q);
      }

      const html = `
        <div class="masthead masthead-narrow">
          <span class="eyebrow">Universidad Adventista Dominicana · Abril 2026</span>
          <h1>${escapeHtml(title)}</h1>
          <div class="meta">${escapeHtml(subtitle)}</div>
        </div>
        <div class="container">
          <p class="landing-lead" style="margin: 24px auto 28px; font-size: 1rem;">Tus respuestas son <em>anónimas</em>. Tiempo estimado: ${fase === "apertura" ? "4–5" : "1–2"} minutos.</p>
          <form id="survey-form" class="stagger" novalidate>
            ${Object.entries(sections).map(([sec, qs], i) => `
              <div class="card">
                <div class="section-head">
                  <span class="eyebrow">Sección ${String(i + 1).padStart(2, "0")}</span>
                  <span class="eyebrow muted">${qs.length} ${qs.length === 1 ? "pregunta" : "preguntas"}</span>
                </div>
                <h2>${escapeHtml(sec)}</h2>
                <hr class="rule" />
                ${qs.map(q => renderField(q)).join("")}
              </div>
            `).join("")}
            <div style="text-align: center; margin-top: 24px;">
              <button type="submit" id="submit-btn">Enviar respuesta</button>
            </div>
          </form>
        </div>
      `;
      app().innerHTML = html;
      bindFieldInteractions(app());

      $("#survey-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("#submit-btn");
        btn.disabled = true;
        btn.textContent = "Enviando…";

        const { data, errors } = readForm(preguntas, app());
        if (errors.length) {
          toast(`Faltan ${errors.length} pregunta(s) por responder`, "error");
          btn.disabled = false;
          btn.textContent = "Enviar respuesta";
          // Scroll to first incomplete
          const firstIncomplete = preguntas.find((q) => errors.includes(q.label));
          if (firstIncomplete) {
            const el = app().querySelector(`.field[data-code="${firstIncomplete.code}"]`);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          return;
        }

        const respId = uuid();
        const payload = { fase, respId, demograficas: data.demograficas, respuestas: data.respuestas };
        const { status, data: resp } = await api("/api/responses", {
          method: "POST",
          body: JSON.stringify(payload),
          retryOnNetwork: true,
        });

        if (status === 201) {
          localStorage.setItem(`encuesta_ia_resp_${fase}`, respId);
          navigate("gracias", { fase });
        } else if (status === 403) {
          toast("La encuesta está cerrada.", "error", 5000);
          btn.disabled = false;
          btn.textContent = "Enviar respuesta";
        } else if (status === 0) {
          toast("Error de red. Verifica tu conexión y reintenta.", "error", 6000);
          btn.disabled = false;
          btn.textContent = "Reintentar envío";
        } else {
          toast(`Error: ${resp.error || "intenta de nuevo"}`, "error", 5000);
          btn.disabled = false;
          btn.textContent = "Enviar respuesta";
        }
      });
    }

    // Map question codes to human labels for dashboard
    function labelFor(code) {
      const all = [...PREGUNTAS_APERTURA, ...PREGUNTAS_CIERRE];
      const q = all.find((x) => x.code === code);
      if (q) return q.label;
      // demografica codes

      const map = { facultad: "Facultad", tiempo_docencia: "Tiempo docencia", sexo: "Sexo" };
      return map[dem] || code;

    function optionLabelFor(code, optionId) {
      const all = [...PREGUNTAS_APERTURA, ...PREGUNTAS_CIERRE];
      const q = all.find((x) => x.code === code || x.code === code.replace(/^dem_/, ""));
      if (q && q.options) {
        const o = q.options.find((opt) => opt.id === optionId);
        if (o) return o.label;

      return optionId;

    function renderLikertChart(canvasId, code, byQuestion, showBenchmark) {
      const data = byQuestion[code];
      if (!data) return;
      const counts = [1,2,3,4,5].map((n) => data.values[n] || 0);

    function annotationFor(benchValue) {
      // Custom plugin not used; we add a simple annotation via afterDraw in subsequent task if needed.
      // For now, empty (the benchmark text is shown separately).
      return { annotations: {} };

    // Paleta secuencial para doughnuts (oxblood family + complementarios)
    const DOUGHNUT_PALETTE = ["#7A2424", "#B6863E", "#5F6F4F", "#1F1A14", "#9B3B3B", "#8E6627", "#828B6E", "#3F4A36"];

    function chartKindFor(q) {
      // Categorical singles → doughnut. Ordinal singles + likerts → bar. Multi → horizontal bar.
      if (q.type === "multi") return "hbar";
      if (q.type === "likert5") return "bar";
      const DOUGHNUT_CODES = new Set([
        "postura",
        "politica_institucional",
        "d2_herramienta",
        "d2_frecuencia",
        "d3_porcentaje",
        "c2_porcentaje",
        "c5_tecnica",
      ]);
      return DOUGHNUT_CODES.has(q.code) ? "doughnut" : "bar";
    }

    function renderDistributionChart(canvasId, code, byQuestion, kind) {
      const data = byQuestion[code];
      if (!data) return;
      const ctx = document.getElementById(canvasId);
      if (!ctx) return;

      const labels = Object.keys(data.values).map((k) => optionLabelFor(code, k));
      const values = Object.values(data.values);
      const total = values.reduce((s, v) => s + v, 0) || 1;

      if (dashboardCharts[canvasId]) {
        dashboardCharts[canvasId].data.labels = labels;
        dashboardCharts[canvasId].data.datasets[0].data = values;
        dashboardCharts[canvasId].update();
        return;
      }

      if (kind === "doughnut") {
        dashboardCharts[canvasId] = new Chart(ctx, {
          type: "doughnut",
          data: {
            labels,
            datasets: [{
              data: values,
              backgroundColor: labels.map((_, i) => DOUGHNUT_PALETTE[i % DOUGHNUT_PALETTE.length]),
              borderColor: "#FFFCF6",
              borderWidth: 2,
              hoverOffset: 6,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "62%",
            plugins: {
              legend: {
                position: "right",
                labels: {
                  font: { family: "'Manrope', sans-serif", size: 11 },
                  color: "#1F1A14",
                  boxWidth: 10,
                  boxHeight: 10,
                  padding: 9,
                  generateLabels(chart) {
                    const d = chart.data;
                    if (!d.labels || !d.datasets.length) return [];
                    return d.labels.map((label, i) => {
                      const v = d.datasets[0].data[i] || 0;
                      const pct = total ? Math.round((v / total) * 100) : 0;
                      return {
                        text: `${label} · ${pct}%`,
                        fillStyle: d.datasets[0].backgroundColor[i],
                        strokeStyle: d.datasets[0].backgroundColor[i],
                        lineWidth: 0,
                        hidden: false,
                        index: i,
                      };
                    });
                  },
                },
              },
              tooltip: {
                callbacks: {
                  label(ctx) {
                    const v = ctx.parsed;
                    const pct = total ? Math.round((v / total) * 100) : 0;
                    return ` ${ctx.label}: ${v} (${pct}%)`;
                  },
                },
              },
            },
            animation: { animateRotate: true, duration: 600 },
          },
        });
        return;
      }

      // Default: bar (vertical or horizontal)
      const horizontal = kind === "hbar";
      dashboardCharts[canvasId] = new Chart(ctx, {

    function startDashboardPolling(fase, showBenchmark, activeFilters = {}) {
      stopDashboardPolling();
      const qs = new URLSearchParams({ fase, ...activeFilters }).toString();
      const tick = async () => {
        const { status, data } = await api(`/api/aggregate?${qs}`);
        if (status !== 200) return;
        renderDashboardData(fase, data, showBenchmark);
      };
      tick();
      dashboardPollHandle = setInterval(tick, POLL_INTERVAL_MS);
    }

    function stopDashboardPolling() {
      if (dashboardPollHandle) clearInterval(dashboardPollHandle);
      dashboardPollHandle = null;
      destroyAllCharts();
    }

    window.addEventListener("hashchange", () => {
      const r = getRoute();
      if (r.name !== "dashboard") stopDashboardPolling();
    });

    function timeAgo(iso) {
      if (!iso) return "—";
      const ms = Date.now() - new Date(iso).getTime();
      if (ms < 1000) return "ahora";
      const s = Math.floor(ms / 1000);
      if (s < 60) return `hace ${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) return `hace ${m}m`;
      return `hace ${Math.floor(m / 60)}h`;
    }

    function renderFilterDropdown(code, label, options, activeFilters) {
      const current = activeFilters[code] || "";
      return `
        <select class="filter-dd" data-code="${code}" style="min-height:36px; padding: 4px 8px; font-size: 0.9rem;">
          <option value="">${escapeHtml(label)}: todos</option>
          ${options.map(o => `<option value="${escapeHtml(o.id)}" ${current === o.id ? "selected" : ""}>${escapeHtml(o.label)}</option>`).join("")}
        </select>
      `;
    }

    function renderDashboardData(fase, data, showBenchmark) {
      const meta = $("#dashboard-meta");
      if (meta) {
        const filterCount = Object.keys(data.filters || {}).length;
        meta.textContent = `n=${data.n}${filterCount ? ` filtrado · ${data.nTotal} total` : ""} · última ${timeAgo(data.lastTs)}`;
      }

      const sections = $("#dashboard-sections");
      if (!sections) return;

      if (data.n === 0) {
        sections.innerHTML = `<div class="card"><h2>Sin datos para mostrar</h2><p>Cambia los filtros o espera más respuestas.</p></div>`;
        sections.dataset.builtFor = "";
        destroyAllCharts();
        return;
      }

      if (data.n < 5 && Object.keys(data.filters || {}).length > 0) {
        sections.innerHTML = `<div class="card"><h2>n insuficiente (n=${data.n})</h2><p>Para evitar gráficas engañosas con celdas pequeñas, no se muestra el detalle cuando hay menos de 5 respuestas en la combinación de filtros activos. Quita uno o más filtros para ver más datos.</p></div>`;
        sections.dataset.builtFor = "";
        destroyAllCharts();
        return;
      }

      const preguntas = fase === "apertura" ? PREGUNTAS_APERTURA : PREGUNTAS_CIERRE;
      const grouped = {};
      for (const q of preguntas) {
        if (q.scope === "demograficas") continue;
        grouped[q.section] = grouped[q.section] || [];
        grouped[q.section].push(q);
      }

      const builtFor = `${fase}::${JSON.stringify(data.filters || {})}`;
      if (sections.dataset.builtFor !== builtFor) {
        destroyAllCharts();
        sections.innerHTML = "";
        let secIdx = 0;
        for (const [secName, qs] of Object.entries(grouped)) {
          secIdx += 1;
          const card = document.createElement("div");
          card.className = "card";
          const grid = document.createElement("div");
          grid.className = "dash-grid";
          card.innerHTML = `
            <div class="section-head">
              <span class="eyebrow">Sección ${String(secIdx).padStart(2, "0")}</span>
              <span class="eyebrow muted">${qs.length} ${qs.length === 1 ? "pregunta" : "preguntas"}</span>
            </div>
            <h2>${escapeHtml(secName)}</h2>
            <hr class="rule" />
          `;
          for (const q of qs) {
            const kind = chartKindFor(q);
            const wrap = document.createElement("div");
            wrap.className = "dash-chart-wrap" + (kind === "hbar" ? " full" : "");
            const height = kind === "hbar" ? 260 : kind === "doughnut" ? 220 : 200;
            wrap.innerHTML = `
              <h3>${escapeHtml(q.label)}</h3>
              <div style="height: ${height}px;">
                <canvas id="chart_${q.code}"></canvas>
              </div>
              <div id="benchmark_${q.code}" class="benchmark hidden"></div>
            `;
            grid.appendChild(wrap);
          }
          card.appendChild(grid);
          sections.appendChild(card);
        }
        sections.dataset.builtFor = builtFor;
      }

      for (const q of preguntas) {
        if (q.scope === "demograficas") continue;
        if (q.type === "likert5") {
          renderLikertChart(`chart_${q.code}`, q.code, data.byQuestion, showBenchmark);
        } else {
          renderDistributionChart(`chart_${q.code}`, q.code, data.byQuestion, chartKindFor(q));
        }
        const benchEl = document.getElementById(`benchmark_${q.code}`);
        if (benchEl) {
          if (showBenchmark && BENCHMARKS[q.code]) {
            benchEl.className = "benchmark";
            benchEl.innerHTML = `<strong>Evidencia</strong> ${escapeHtml(BENCHMARKS[q.code].label)}${BENCHMARKS[q.code].value !== undefined ? ` <em>(referencia: ${escapeHtml(String(BENCHMARKS[q.code].value))})</em>` : ""}`;
          } else {
            benchEl.className = "benchmark hidden";
            benchEl.innerHTML = "";
          }
        }
      }
    }

    async function exportData(fase, format) {
      const { status, data } = await api(`/api/responses?fase=${fase}`, { requireAdmin: true });
      if (status !== 200) {
        toast(`Error: ${data.error || "no se pudo exportar"}`, "error");
        return;
      }

      let blob, filename;
      if (format === "json") {
        blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        filename = `encuesta_ia_${fase}_${new Date().toISOString().slice(0,10)}.json`;
      } else {
        // CSV: respId, ts, then demograficas keys, then respuestas keys (multi as ; joined)
        const items = data.items || [];
        if (items.length === 0) { toast("Sin respuestas para exportar", "info"); return; }
        const demKeys = new Set();
        const respKeys = new Set();
        for (const it of items) {
          for (const k of Object.keys(it.demograficas || {})) demKeys.add(k);
          for (const k of Object.keys(it.respuestas || {})) respKeys.add(k);
        }
        const headers = ["respId", "ts", ...[...demKeys].map(k => `dem_${k}`), ...respKeys];
        const rows = [headers.join(",")];
        for (const it of items) {
          const row = [it.respId, it.ts];
          for (const k of demKeys) row.push(csvCell(it.demograficas?.[k]));
          for (const k of respKeys) row.push(csvCell(it.respuestas?.[k]));
          rows.push(row.join(","));
        }
        blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8" });
        filename = `encuesta_ia_${fase}_${new Date().toISOString().slice(0,10)}.csv`;
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(v) {
      if (v === null || v === undefined) return "";
      const s = Array.isArray(v) ? v.join(";") : String(v);
      if (/[",\n;]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
      return s;
    }

        if (existing && !params.force) {
          app().innerHTML = `
            <div class="masthead masthead-narrow"><span class="eyebrow">Apertura</span><h1>Ya respondiste</h1></div>
            <div class="container">
              <div class="card">
                <p>Detectamos que ya respondiste la encuesta de apertura desde este dispositivo. Si necesitas corregir, contacta al facilitador.</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px;">
                  <a class="btn" href="#dashboard">Ver dashboard</a>
                  <button class="btn-ghost" onclick="navigate('apertura', {force: '1'})">Re-enviar de todos modos</button>
                </div>
              </div>
            </div>`;
          return;
        }

        // Check phase
        api("/api/phase").then(({ data }) => {
          if (data.phase === "cerrada") {
            app().innerHTML = `
              <div class="masthead masthead-narrow"><span class="eyebrow">Apertura</span><h1>Encuesta cerrada</h1></div>
              <div class="container">
                <div class="card"><p>Gracias por participar.</p></div>
              </div>`;
            return;
          }
          renderFormPage({
            title: "Apertura",
            subtitle: "Sesión 1 — Estado del arte y diagnóstico inicial",
            preguntas: PREGUNTAS_APERTURA,
            fase: "apertura",
          });
        });
      },
      cierre(params) {
        const existing = localStorage.getItem("encuesta_ia_resp_cierre");
        if (existing && !params.force) {
          app().innerHTML = `
            <div class="masthead masthead-narrow"><span class="eyebrow">Cierre</span><h1>Ya respondiste</h1></div>
            <div class="container">
              <div class="card">
                <p>Detectamos que ya respondiste la encuesta de cierre desde este dispositivo.</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px;">
                  <a class="btn" href="#dashboard">Ver dashboard</a>
                  <button class="btn-ghost" onclick="navigate('cierre', {force: '1'})">Re-enviar de todos modos</button>
                </div>
              </div>
            </div>`;
          return;
        }

        api("/api/phase").then(({ data }) => {
          if (data.phase === "cerrada") {
            app().innerHTML = `
              <div class="masthead masthead-narrow"><span class="eyebrow">Cierre</span><h1>Encuesta cerrada</h1></div>
              <div class="container">
                <div class="card"><p>Gracias por participar.</p></div>
              </div>`;
            return;
          }
          renderFormPage({
            title: "Cierre",
            subtitle: "Sesión 2 — Reflexión final y compromiso",
            preguntas: PREGUNTAS_CIERRE,
            fase: "cierre",
          });
        });
      },
      gracias(params) {
        const isApertura = params.fase === "apertura";
        app().innerHTML = `
          <div class="masthead">
            <span class="eyebrow">Recibido</span>
            <h1><em style="font-style: italic; color: var(--oxblood);">Gracias</em></h1>
            <div class="meta">Tu respuesta fue registrada</div>
          </div>
          <div class="container">
            <div class="card" style="text-align: center;">
              <div class="ornament"></div>
              <p style="font-family: 'Fraunces', serif; font-style: italic; font-size: 1.1rem; color: var(--ink); max-width: 460px; margin: 0 auto 22px;">${isApertura
                ? "Espera la proyección del facilitador para ver los resultados del grupo."
                : "Vamos a comparar estas respuestas con las del inicio."}</p>
              <a class="btn btn-ghost" href="#">Volver al inicio</a>
            </div>
          </div>`;
      },
      dashboard(params) {
        const fase = params.fase || "apertura";
        const showBenchmark = params.benchmark === "1";
        const activeFilters = {};
        for (const k of ["facultad", "tiempo_docencia", "sexo", "postura"]) {
          if (params[k]) activeFilters[k] = params[k];
        }

        const faseLabel = fase === "apertura" ? "Apertura" : fase === "cierre" ? "Cierre" : "Comparativo";
        app().innerHTML = `
          <div class="masthead masthead-narrow">
            <span class="eyebrow">Dashboard en vivo</span>
            <h1>${escapeHtml(faseLabel)}</h1>
            <div class="meta" id="dashboard-meta">Cargando…</div>
          </div>
          <div class="container-wide">
            <div class="dash-toolbar">
              <span class="eyebrow">Fase</span>
              <a class="btn ${fase === "apertura" ? "" : "btn-ghost"}" href="#dashboard?fase=apertura">Apertura</a>
              <a class="btn ${fase === "cierre" ? "" : "btn-ghost"}" href="#dashboard?fase=cierre">Cierre</a>
              <a class="btn ${fase === "comparativo" ? "" : "btn-ghost"}" href="#dashboard?fase=comparativo">Comparativo</a>
              <span class="spacer"></span>
              <button id="toggle-benchmark-btn" class="${showBenchmark ? "btn-success" : "btn-secondary"}">
                ${showBenchmark ? "✓ Mostrando evidencia" : "Mostrar evidencia"}
              </button>
            </div>
            <div class="dash-toolbar" id="filter-bar">
              <span class="eyebrow">Filtros</span>
              ${renderFilterDropdown("facultad", "Facultad", FACULTADES, activeFilters)}
              ${renderFilterDropdown("tiempo_docencia", "Tiempo docencia", [
                {id:"<5",label:"<5 años"},{id:"5-14",label:"5–14 años"},{id:"15-24",label:"15–24 años"},{id:"25+",label:"25+ años"}
              ], activeFilters)}
              ${renderFilterDropdown("sexo", "Sexo", [
                {id:"F",label:"Femenino"},{id:"M",label:"Masculino"},{id:"prefiero-no-decir",label:"PND"}
              ], activeFilters)}
              ${fase === "apertura" ? renderFilterDropdown("postura", "Postura", [
                {id:"entusiasmo",label:"Entusiasmo"},{id:"curiosidad-cautelosa",label:"Curiosidad"},{id:"neutral",label:"Neutral"},{id:"preocupacion",label:"Preocupación"},{id:"rechazo",label:"Rechazo"}
              ], activeFilters) : ""}
              ${Object.keys(activeFilters).length > 0 ? `<button id="clear-filters-btn" class="btn-ghost">Limpiar filtros</button>` : ""}
            </div>

            <div id="dashboard-sections"></div>
          </div>
        `;

        // Bind filter dropdowns
        document.querySelectorAll(".filter-dd").forEach((sel) => {
          sel.addEventListener("change", () => {
            const newFilters = { ...activeFilters };
            if (sel.value) newFilters[sel.dataset.code] = sel.value;
            else delete newFilters[sel.dataset.code];
            navigate("dashboard", { fase, ...newFilters, ...(showBenchmark ? { benchmark: "1" } : {}) });
          });
        });

        // Bind toggle benchmark + clear filters
        const _toggleBtn = document.getElementById("toggle-benchmark-btn");
        if (_toggleBtn) {
          _toggleBtn.addEventListener("click", () => {
            const next = { fase, ...activeFilters };
            if (!showBenchmark) next.benchmark = "1";
            navigate("dashboard", next);
          });
        }
        const _clearBtn = document.getElementById("clear-filters-btn");
        if (_clearBtn) {
          _clearBtn.addEventListener("click", () => {
            const next = { fase };
            if (showBenchmark) next.benchmark = "1";
            navigate("dashboard", next);
          });
        }

        if (fase === "comparativo") {
          startComparativoPolling(showBenchmark);
          return;
        }

        startDashboardPolling(fase, showBenchmark, activeFilters);
      },
      admin(params) {
        const token = sessionStorage.getItem("encuesta_ia_admin_token");
        if (!token) {
          app().innerHTML = `
            <div class="masthead masthead-narrow">
              <span class="eyebrow">Restringido</span>
              <h1>Acceso facilitador</h1>
            </div>
            <div class="container">
              <div class="card" style="max-width: 420px; margin: 24px auto;">
                <div class="ornament"></div>
                <h2 style="text-align: center;">Ingresa tu matrícula</h2>
                <hr class="rule" />
                <form id="auth-form">
                  <div class="field" style="border: none; padding-bottom: 0;">
                    <input type="password" id="auth-token" placeholder="Matrícula" autocomplete="off" autofocus />
                  </div>
                  <button type="submit" style="width: 100%;">Ingresar</button>
                </form>
              </div>
            </div>`;
          $("#auth-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const v = $("#auth-token").value.trim();
            sessionStorage.setItem("encuesta_ia_admin_token", v);
            // Verify by trying to PUT phase to current value
            const { data: phaseData } = await api("/api/phase");
            const { status } = await api("/api/phase", {
              method: "PUT",
              body: JSON.stringify({ phase: phaseData.phase || "apertura" }),
              requireAdmin: true,
            });
            if (status === 200) {
              render(); // re-render to show admin
            } else {
              sessionStorage.removeItem("encuesta_ia_admin_token");
              toast("Matrícula incorrecta", "error");
            }
          });
          return;
        }

        renderAdminPanel();
      },
    };
  </script>
</body>
</html>
